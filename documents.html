<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件範本｜Logistics Starter Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/design-system.css?v=4">
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="assets/document-templates.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans selection:bg-indigo-500 selection:text-white">
    <header class="site-header">
        <div class="site-header-shell">
            <a href="index.html" class="site-brand" aria-label="Logistics Starter Guide 首頁">
                <span class="site-brand-mark" aria-hidden="true">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </span>
                <span><strong>Logistics Starter Guide</strong><small>國際物流新人學習手冊</small></span>
            </a>
            <nav class="site-nav" aria-label="主要導覽">
                <a href="index.html">首頁</a>
                <a href="index.html#glossary">名詞</a>
                <a href="clearance-map.html">流程</a>
                <a href="documents.html" aria-current="page">文件</a>
                <a href="market-map.html">產業</a>
            </nav>
        </div>
    </header>

    <main class="document-page flex-grow">
        <section class="document-intro" aria-labelledby="pageTitle">
            <p class="document-eyebrow">Document Template Learning</p>
            <h1 id="pageTitle">文件範本展示</h1>
            <p>四份已去識別的空白訓練範本，供辨識文件版面與欄位使用。</p>
        </section>

        <div class="document-notice" role="note">
            <span aria-hidden="true">⚠</span>
            <p>僅供個人學習</p>
        </div>

        <section id="documentViewer" class="document-viewer" aria-labelledby="viewerTitle">
            <div class="viewer-toolbar">
                <div class="viewer-control-group" aria-label="文件與縮放控制">
                    <button id="previousDocument" class="viewer-icon-button" type="button" aria-label="上一份文件" title="上一份文件">‹</button>
                    <button id="nextDocument" class="viewer-icon-button" type="button" aria-label="下一份文件" title="下一份文件">›</button>
                    <span class="viewer-divider" aria-hidden="true"></span>
                    <button id="zoomOut" class="viewer-icon-button" type="button" aria-label="縮小預覽" title="縮小預覽">−</button>
                    <output id="zoomLevel" class="viewer-zoom-level" aria-live="polite">100%</output>
                    <button id="zoomIn" class="viewer-icon-button" type="button" aria-label="放大預覽" title="放大預覽">＋</button>
                    <button id="fitWidth" class="viewer-text-button" type="button">符合寬度</button>
                </div>
                <div class="viewer-control-group viewer-control-group-end">
                    <span id="documentPosition" class="viewer-position" aria-live="polite">1 / 4</span>
                    <a id="openPreview" class="viewer-icon-button viewer-link-button" target="_blank" rel="noopener" aria-label="在新分頁開啟 PDF" title="在新分頁開啟 PDF">↗</a>
                    <button id="toggleFullscreen" class="viewer-icon-button" type="button" aria-label="切換全螢幕" aria-pressed="false" title="切換全螢幕">⛶</button>
                </div>
            </div>

            <div id="documentTabs" class="document-tabs" role="tablist" aria-label="切換文件範本"></div>

            <div id="documentStage" class="document-stage">
                <button id="stagePrevious" class="viewer-edge-button viewer-edge-previous" type="button" aria-label="上一份文件">‹</button>
                <div id="documentFrameShell" class="document-frame-shell">
                    <iframe id="documentFrame" class="document-frame" title="文件範本預覽"></iframe>
                </div>
                <button id="stageNext" class="viewer-edge-button viewer-edge-next" type="button" aria-label="下一份文件">›</button>
            </div>

            <div class="viewer-caption">
                <div>
                    <p id="viewerMeta" class="viewer-meta"></p>
                    <h2 id="viewerTitle"></h2>
                    <p id="viewerChineseTitle" class="viewer-chinese-title"></p>
                </div>
                <a id="downloadDocument" class="document-download" download>下載 DOCX</a>
            </div>
        </section>

        <section class="document-information" aria-labelledby="informationTitle">
            <div>
                <h2 id="informationTitle">文件用途</h2>
                <p id="documentPurpose"></p>
                <h3>何時使用</h3>
                <p id="documentWhenUsed"></p>
            </div>
            <div>
                <h2>可辨識欄位</h2>
                <ul id="documentFields" class="document-field-list"></ul>
            </div>
        </section>
    </main>

    <footer class="bg-slate-900 text-slate-400 text-center text-xs py-5 px-4">本頁僅供物流入門教學。正式作業仍應以公司 SOP、承運人與主管機關規定為準。</footer>
    <script src="data/document-templates.js"></script>
    <script src="assets/document-templates.js"></script>
</body>
</html>
